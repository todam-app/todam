services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: todam-postgres
    environment:
      POSTGRES_DB: todam
      POSTGRES_PASSWORD: todam
      POSTGRES_USER: todam
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todam -d todam"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - todam-postgres-data:/var/lib/postgresql/data

volumes:
  todam-postgres-data:
