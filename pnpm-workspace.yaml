packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  unrs-resolver: true
auditConfig:
  # ESLint/minimatch 3 est incompatible avec brace-expansion 5.
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
minimumReleaseAgeExclude:
  - "@better-auth/core@1.6.25"
  - "@better-auth/drizzle-adapter@1.6.25"
  - "@better-auth/expo@1.6.25"
  - "@better-auth/kysely-adapter@1.6.25"
  - "@better-auth/memory-adapter@1.6.25"
  - "@better-auth/mongo-adapter@1.6.25"
  - "@better-auth/prisma-adapter@1.6.25"
  - "@better-auth/telemetry@1.6.25"
  - better-auth@1.6.25
  - uuid@11.1.1
  - js-yaml@4.3.0 || 5.2.2
  - "@fastify/static@10.1.2"
  - brace-expansion@5.0.8
# Correctifs transitoires des dépendances indirectes sans version parente corrigée.
overrides:
  "@fastify/static@<=10.1.1": 10.1.2
  "minimatch@10.2.5>brace-expansion": 5.0.8
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  js-yaml@>=4.0.0 <4.3.0: 4.3.0
  js-yaml@>=5.0.0 <=5.2.1: 5.2.2
  uuid@<11.1.1: 11.1.1
