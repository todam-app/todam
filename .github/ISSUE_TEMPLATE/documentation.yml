name: Documentation
description: Signaler une erreur ou proposer une amélioration documentaire.
title: "[Docs] "
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: Page ou fichier concerné
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Problème
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Correction proposée
