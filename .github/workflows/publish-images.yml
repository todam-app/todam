name: Publier les images de production

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      deploy:
        description: Déclencher Coolify après la publication des images
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  quality:
    name: Vérifications avant publication
    if:
      ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
      == true }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: todam
          POSTGRES_USER: todam
          POSTGRES_PASSWORD: todam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todam -d todam" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://todam:todam@127.0.0.1:5432/todam
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000/v1/auth
      WEB_APP_URL: http://127.0.0.1:8081
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3000
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Installer pnpm
        uses: pnpm/action-setup@v6
      - name: Configurer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Vérifier le monorepo
        run: pnpm check
      - name: Migrer une base vide
        run: pnpm db:migrate
      - name: Exécuter les tests PostgreSQL
        run: pnpm test:integration

  server-images:
    name: Construire ${{ matrix.component }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - api
          - jobs
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Normaliser le propriétaire GHCR
        id: registry
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Se connecter à GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/todam-${{ matrix.component }}:latest
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/todam-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  web-image:
    name: Construire le Web et les archives juridiques
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    env:
      LEGAL_RELEASE_READY: "true"
      PUBLIC_WEB_URL: https://todam.fr
      EXPO_PUBLIC_WEB_URL: https://todam.fr
      EXPO_PUBLIC_API_URL: https://api.todam.fr
      LEGAL_OPERATOR_NAME: ${{ secrets.LEGAL_OPERATOR_NAME }}
      PRIMARY_HOST_NAME: OVH SAS
      PRIMARY_HOST_ADDRESS: 2 rue Kellermann, 59100 Roubaix, France
      PRIMARY_HOST_PHONE: "+33 9 72 10 10 07"
      PRIMARY_HOST_URL: https://www.ovhcloud.com
      OBJECT_HOST_NAME: Cloudflare, Inc.
      OBJECT_HOST_ADDRESS: "101 Townsend Street, San Francisco, CA 94107, USA"
      OBJECT_HOST_URL: https://www.cloudflare.com
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EXPO_PUBLIC_LEGAL_OPERATOR_NAME: ${{ secrets.LEGAL_OPERATOR_NAME }}
      EXPO_PUBLIC_PRIMARY_HOST_NAME: OVH SAS
      EXPO_PUBLIC_PRIMARY_HOST_ADDRESS: 2 rue Kellermann, 59100 Roubaix, France
      EXPO_PUBLIC_PRIMARY_HOST_PHONE: "+33 9 72 10 10 07"
      EXPO_PUBLIC_PRIMARY_HOST_URL: https://www.ovhcloud.com
      EXPO_PUBLIC_OBJECT_HOST_NAME: Cloudflare, Inc.
      EXPO_PUBLIC_OBJECT_HOST_ADDRESS:
        "101 Townsend Street, San Francisco, CA 94107, USA"
      EXPO_PUBLIC_OBJECT_HOST_URL: https://www.cloudflare.com
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Installer pnpm
        uses: pnpm/action-setup@v6
      - name: Configurer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Installer le générateur PDF
        run: python -m pip install reportlab==5.0.0 pypdf==6.10.0
      - name: Générer et vérifier les documents juridiques
        run: |
          pnpm legal:generate
          pnpm legal:pdf
          pnpm legal:check
      - name: Normaliser le propriétaire GHCR
        id: registry
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Se connecter à GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier le Web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/todam-web:latest
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/todam-web:${{ github.sha }}
          build-args: |
            EXPO_PUBLIC_API_URL=https://api.todam.fr
            EXPO_PUBLIC_WEB_URL=https://todam.fr
            EXPO_PUBLIC_LEGAL_OPERATOR_NAME=${{ secrets.LEGAL_OPERATOR_NAME }}
            EXPO_PUBLIC_PRIMARY_HOST_NAME=OVH SAS
            EXPO_PUBLIC_PRIMARY_HOST_ADDRESS=2 rue Kellermann, 59100 Roubaix, France
            EXPO_PUBLIC_PRIMARY_HOST_PHONE=+33 9 72 10 10 07
            EXPO_PUBLIC_PRIMARY_HOST_URL=https://www.ovhcloud.com
            EXPO_PUBLIC_OBJECT_HOST_NAME=Cloudflare, Inc.
            EXPO_PUBLIC_OBJECT_HOST_ADDRESS=101 Townsend Street, San Francisco, CA 94107, USA
            EXPO_PUBLIC_OBJECT_HOST_URL=https://www.cloudflare.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Déclencher Coolify
    if:
      ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
      }}
    needs:
      - server-images
      - web-image
    runs-on: ubuntu-latest
    environment: production
    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_API_WEBHOOK: ${{ secrets.COOLIFY_API_WEBHOOK }}
      COOLIFY_JOBS_WEBHOOK: ${{ secrets.COOLIFY_JOBS_WEBHOOK }}
      COOLIFY_WEB_WEBHOOK: ${{ secrets.COOLIFY_WEB_WEBHOOK }}
    steps:
      - name: Relancer les trois ressources Coolify
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COOLIFY_TOKEN"
          for webhook in \
            "$COOLIFY_API_WEBHOOK" \
            "$COOLIFY_JOBS_WEBHOOK" \
            "$COOLIFY_WEB_WEBHOOK"
          do
            test -n "$webhook"
            curl \
              --fail \
              --retry 3 \
              --show-error \
              --silent \
              --header "Authorization: Bearer $COOLIFY_TOKEN" \
              "$webhook"
          done
