name: Publier les images de production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Déclencher Coolify après la publication des images
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  quality:
    name: Vérifications avant publication
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: todam_integration
          POSTGRES_USER: todam
          POSTGRES_PASSWORD: todam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todam -d todam_integration" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://todam:todam@127.0.0.1:5432/todam_integration
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000/v1/auth
      WEB_APP_URL: http://127.0.0.1:8081
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3000
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Installer pnpm
        uses: pnpm/action-setup@v6
      - name: Configurer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Vérifier le monorepo
        run: pnpm check
      - name: Vérifier le contrat SEO servi par Nginx
        shell: bash
        run: |
          set -euo pipefail
          container_name="todam-seo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container_name" \
            --publish 127.0.0.1:18082:8080 \
            --volume "$PWD/apps/todam/dist:/usr/share/nginx/html:ro" \
            --volume "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.29-alpine

          ready="false"
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18082/health/live >/dev/null; then
              ready="true"
              break
            fi
            sleep 1
          done
          test "$ready" = "true"
          pnpm seo:check -- --base-url=http://127.0.0.1:18082
      - name: Migrer une base vide
        run: pnpm db:migrate
      - name: Exécuter les tests PostgreSQL
        run: pnpm test:integration

  server-images:
    name: Construire ${{ matrix.component }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - api
          - jobs
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Normaliser le propriétaire GHCR
        id: registry
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Se connecter à GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/todam-${{ matrix.component }}:latest
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/todam-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }},ignore-error=true

  prepare-production-api:
    name: Déployer et attendre l’API de production
    needs:
      - server-images
    runs-on: ubuntu-latest
    environment: production
    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_API_WEBHOOK: ${{ secrets.COOLIFY_API_WEBHOOK }}
      COOLIFY_JOBS_WEBHOOK: ${{ secrets.COOLIFY_JOBS_WEBHOOK }}
    steps:
      - name: Déployer l’API et les Jobs avant le Web
        if:
          ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
          github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COOLIFY_TOKEN"

          components=("API" "Jobs")
          webhooks=("$COOLIFY_API_WEBHOOK" "$COOLIFY_JOBS_WEBHOOK")

          for index in "${!webhooks[@]}"; do
            webhook="${webhooks[$index]}"
            test -n "$webhook"
            printf 'Déclenchement Coolify : %s\n' "${components[$index]}"
            curl \
              --request POST \
              --fail-with-body \
              --retry 3 \
              --show-error \
              --silent \
              --header "Authorization: Bearer $COOLIFY_TOKEN" \
              "$webhook"
          done
      - name: Attendre le contrat catalogue requis par le build Web
        shell: bash
        run: |
          set -euo pipefail

          for _ in $(seq 1 60); do
            if curl \
              --fail \
              --show-error \
              --silent \
              "https://api.todam.fr/v1/search?type=companies&limit=1" \
              | node -e '
                  let body = "";
                  process.stdin.on("data", (chunk) => (body += chunk));
                  process.stdin.on("end", () => {
                    const value = JSON.parse(body);
                    if (value.type !== "companies" || !Array.isArray(value.companies)) {
                      process.exitCode = 1;
                    }
                  });
                '
            then
              exit 0
            fi
            sleep 5
          done

          echo "L’API de production n’expose pas le contrat catalogue attendu." >&2
          exit 1

  web-image:
    name: Construire le Web et les archives juridiques
    needs:
      - quality
      - prepare-production-api
    runs-on: ubuntu-latest
    environment: production
    env:
      LEGAL_RELEASE_READY: "true"
      PUBLIC_WEB_URL: https://todam.fr
      EXPO_PUBLIC_WEB_URL: https://todam.fr
      EXPO_PUBLIC_API_URL: https://api.todam.fr
      LEGAL_OPERATOR_NAME: ${{ secrets.LEGAL_OPERATOR_NAME }}
      PRIMARY_HOST_NAME: OVH SAS
      PRIMARY_HOST_ADDRESS: 2 rue Kellermann, 59100 Roubaix, France
      PRIMARY_HOST_PHONE: "+33 9 72 10 10 07"
      PRIMARY_HOST_URL: https://www.ovhcloud.com
      OBJECT_HOST_NAME: Cloudflare, Inc.
      OBJECT_HOST_ADDRESS: "101 Townsend Street, San Francisco, CA 94107, USA"
      OBJECT_HOST_URL: https://www.cloudflare.com
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EXPO_PUBLIC_LEGAL_OPERATOR_NAME: ${{ secrets.LEGAL_OPERATOR_NAME }}
      EXPO_PUBLIC_PRIMARY_HOST_NAME: OVH SAS
      EXPO_PUBLIC_PRIMARY_HOST_ADDRESS: 2 rue Kellermann, 59100 Roubaix, France
      EXPO_PUBLIC_PRIMARY_HOST_PHONE: "+33 9 72 10 10 07"
      EXPO_PUBLIC_PRIMARY_HOST_URL: https://www.ovhcloud.com
      EXPO_PUBLIC_OBJECT_HOST_NAME: Cloudflare, Inc.
      EXPO_PUBLIC_OBJECT_HOST_ADDRESS:
        "101 Townsend Street, San Francisco, CA 94107, USA"
      EXPO_PUBLIC_OBJECT_HOST_URL: https://www.cloudflare.com
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Installer pnpm
        uses: pnpm/action-setup@v6
      - name: Configurer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Configurer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Installer le générateur PDF
        run: python -m pip install reportlab==5.0.0 pypdf==6.10.0
      - name: Générer et vérifier les documents juridiques
        run: |
          pnpm legal:generate
          pnpm legal:pdf
          pnpm legal:check
      - name: Normaliser le propriétaire GHCR
        id: registry
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Se connecter à GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier le Web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/todam-web:latest
            ${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/todam-web:${{ github.sha }}
          build-args: |
            EXPO_PUBLIC_API_URL=https://api.todam.fr
            EXPO_PUBLIC_WEB_URL=https://todam.fr
            EXPO_PUBLIC_BUILD_SHA=${{ github.sha }}
            EXPO_PUBLIC_LEGAL_OPERATOR_NAME=${{ secrets.LEGAL_OPERATOR_NAME }}
            EXPO_PUBLIC_PRIMARY_HOST_NAME=OVH SAS
            EXPO_PUBLIC_PRIMARY_HOST_ADDRESS=2 rue Kellermann, 59100 Roubaix, France
            EXPO_PUBLIC_PRIMARY_HOST_PHONE=+33 9 72 10 10 07
            EXPO_PUBLIC_PRIMARY_HOST_URL=https://www.ovhcloud.com
            EXPO_PUBLIC_OBJECT_HOST_NAME=Cloudflare, Inc.
            EXPO_PUBLIC_OBJECT_HOST_ADDRESS=101 Townsend Street, San Francisco, CA 94107, USA
            EXPO_PUBLIC_OBJECT_HOST_URL=https://www.cloudflare.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web,ignore-error=true

  deploy-web:
    name: Déployer le Web
    if:
      ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
      github.event_name == 'push' }}
    needs:
      - web-image
    runs-on: ubuntu-latest
    environment: production
    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_WEB_WEBHOOK: ${{ secrets.COOLIFY_WEB_WEBHOOK }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Configurer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Relancer la ressource Web Coolify
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COOLIFY_TOKEN"
          test -n "$COOLIFY_WEB_WEBHOOK"
          curl \
            --request POST \
            --fail-with-body \
            --retry 3 \
            --show-error \
            --silent \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEB_WEBHOOK"
      - name: Vérifier le déploiement public et le domaine canonique
        shell: bash
        run: |
          set -euo pipefail

          for _ in $(seq 1 60); do
            if node scripts/check-web-seo.mjs \
              --runtime-only \
              --live \
              --base-url=https://todam.fr \
              >/dev/null 2>&1
            then
              node scripts/check-web-seo.mjs \
                --runtime-only \
                --live \
                --base-url=https://todam.fr
              exit 0
            fi
            sleep 5
          done

          node scripts/check-web-seo.mjs \
            --runtime-only \
            --live \
            --base-url=https://todam.fr
