name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes and licences
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Review dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          license-check: true
          # ESLint exige minimatch 3, incompatible avec la seule version corrigée de brace-expansion.
          # Cette chaîne est limitée au lint de fichiers contrôlés dans le dépôt.
          allow-ghsas: GHSA-mh99-v99m-4gvg
