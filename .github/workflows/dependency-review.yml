name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes and licences
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          license-check: true
