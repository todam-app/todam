name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: lint, types, tests and OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Lint repository
        run: pnpm lint
      - name: Check types
        run: pnpm typecheck
      - name: Run tests
        run: pnpm test
      - name: Validate OpenAPI
        run: pnpm validate:openapi
      - name: Check licences
        run: pnpm check:licenses
