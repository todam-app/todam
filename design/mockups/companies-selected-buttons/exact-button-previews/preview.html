<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1448, initial-scale=1" />
    <title>Aperçu des boutons Todam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --todam-button-surface: #fffdf8;
        --todam-ink: #171412;
        --todam-red: #c43d28;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 1086px;
        margin: 0;
        overflow: hidden;
        width: 1448px;
      }

      .page {
        height: 1086px;
        position: relative;
        width: 1448px;
      }

      .page-image {
        display: block;
        height: 1086px;
        left: 0;
        position: absolute;
        top: 0;
        width: 1448px;
      }

      .hero-button {
        align-items: center;
        background: var(--todam-button-surface);
        border-style: solid;
        color: var(--todam-ink);
        display: flex;
        font-family: "Work Sans", Arial, sans-serif;
        font-size: 20px;
        font-weight: 500;
        height: 65px;
        justify-content: center;
        padding: 0 24px;
        position: absolute;
        top: 686px;
        white-space: nowrap;
      }

      .hero-button:first-of-type {
        left: 47px;
        width: 304px;
      }

      .hero-button:last-of-type {
        left: 371px;
        width: 215px;
      }

      [data-variant="01"] .hero-button {
        border-color: var(--todam-red);
        border-radius: 4px;
        border-width: 1px;
        box-shadow: none;
      }

      [data-variant="01"] .hero-button:hover {
        background: var(--todam-red);
        color: var(--todam-button-surface);
      }

      [data-variant="05"] .hero-button {
        border-color: var(--todam-ink);
        border-radius: 3px;
        border-width: 1px;
        box-shadow: inset 3px 0 0 var(--todam-red);
      }
    </style>
  </head>
  <body>
    <main class="page" data-variant="01">
      <img class="page-image" src="source-page.png" alt="" width="1448" height="1086" />
      <div class="hero-button">Trouver ma compagnie</div>
      <div class="hero-button">Nous contacter</div>
    </main>
    <script>
      const variant = new URLSearchParams(window.location.search).get("variant");
      document.querySelector(".page").dataset.variant = variant === "05" ? "05" : "01";
    </script>
  </body>
</html>
