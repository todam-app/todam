server {
    listen 8080;
    server_name www.todam.fr;

    return 308 https://todam.fr$request_uri;
}

server {
    listen 8080 default_server;
    server_name todam.fr _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        font/woff2
        image/svg+xml
        text/css
        text/plain
        text/xml;

    error_page 404 /+not-found.html;

    if ($http_x_forwarded_proto = "http") {
        return 308 https://todam.fr$request_uri;
    }

    location = /health/live {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico {
        try_files $uri =404;
        expires 1d;
    }

    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml {
        try_files $uri =404;
        default_type application/xml;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/transparence/?$ {
        return 308 /les-coulisses;
    }

    location ~* \.woff2?$ {
        try_files $uri =404;
        expires 1y;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:css|gif|ico|jpe?g|js|png|svg|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* ^/legal/.+\.pdf$ {
        try_files $uri =404;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    location ~* \.pdf$ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public";
    }

    location ~ ^/(?:conditions-utilisation|confidentialite|informations-legales|mentions-legales|suppression-compte)/?$ {
        try_files $uri $uri.html =404;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    location ~ ^/(?:profile|journal|listes|parametres-compte|espace-compagnie|moderation|revendiquer-compagnie|signaler|sign-in|sign-up|mot-de-passe-oublie|reinitialiser-mot-de-passe|supprimer-mon-compte|email-verifie)/?$ {
        try_files $uri $uri.html =404;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    location ~ ^/production/[^/]+/?$ {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/lieu/[^/]+/?$ {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/compagnie/[^/]+/?$ {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/membre/[^/]+/listes/[^/]+/?$ {
        try_files $uri $uri.html /membre/[username]/listes/[slug].html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow" always;
    }

    location ~ ^/membre/[^/]+/?$ {
        try_files $uri $uri.html /membre/[username].html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow" always;
    }

    location = /+not-found.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache";
    }
}
